[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hamkit-aprs"
dynamic = ["version"]
description = 'Typed APRS packet parsing and composition foundation.'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "Adam Fourney", email = "adam.fourney@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/afourney/hamkit/blob/main/packages/aprs/README.md"
Issues = "https://github.com/afourney/hamkit/issues"
Source = "https://github.com/afourney/hamkit/blob/main/packages/aprs/README.md"

[tool.hatch.version]
path = "src/hamkit/aprs/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/hamkit/aprs tests}"

[tool.coverage.run]
source_pkgs = ["hamkit.aprs", "tests"]
branch = true
parallel = true
omit = [
  "src/hamkit/aprs/__about__.py",
]

[tool.coverage.paths]
aprs = ["src/hamkit/aprs", "*/aprs/src/hamkit/aprs"]
tests = ["tests", "*/aprs/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
only-packages = true
exclude = [
  "tests/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hamkit"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests"]
explicit_package_bases = true
